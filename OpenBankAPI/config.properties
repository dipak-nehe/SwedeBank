# The app key is NOT stored here. Set it as an environment variable:
#   export SWEDBANK_APP_KEY=...
baseURI = https://psd2.api.swedbank.com:443/partner/sandbox/v1/fx
indicativeRateCcyPairURL = /indicative-rate/currencypairs?app-id=%s
headerNameCcyIndPair = x-request-id
indicativeRateSingleCcyPair = /indicative-rate/rate?currencyPair=%s&app-id=%s
marketOrderApiUrl = /market-order/orders?date=%s&app-id=%s
# Pause between rate calls to stay under the sandbox rate limit (milliseconds)
requestDelayMs = 15000
